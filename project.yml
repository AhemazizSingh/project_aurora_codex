name: FinanceOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  FinanceOS:
    type: application
    platform: iOS
    sources:
      - path: FinanceOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.app
        PRODUCT_NAME: FinanceOS
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - FinanceOSTests
  FinanceOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinanceOSTests
    dependencies:
      - target: FinanceOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.tests
        GENERATE_INFOPLIST_FILE: YES
